name: Publish to NPM

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Update version with build number
        run: |
          ANGULAR_MAJOR=$(node -p "const p=require('./package.json'); const raw=(p.devDependencies&&p.devDependencies['@angular/core'])||(p.peerDependencies&&p.peerDependencies['@angular/core']); if(!raw) throw new Error('missing @angular/core'); String(raw).replace(/^[^0-9]*/,'').split('.')[0]")
          NEW_VERSION="${ANGULAR_MAJOR}.0.${{ github.run_number }}"
          export NEW_VERSION
          node -e "const fs=require('fs'); const p=require('./package.json'); p.version=process.env.NEW_VERSION; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n'); console.log('Publish version: '+p.version)"

      - name: Build library
        run: npm run build:lib

      - name: Publish to NPM
        working-directory: dist/ngx-charts
        run: npm publish --access public --registry https://registry.npmjs.org

